<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>302API 开发者组件示例</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><a href="https://302api.com">302API</a><span>Developer Kit</span></header>
    <h1>把接入做得更简单。</h1>
    <p class="intro">独立的浏览器组件：无框架依赖，不携带密钥，不调用生产接口。</p>
    <section>
      <h2>模型名称筛选</h2>
      <p>以下为虚构演示条目，不代表本站当前可用模型目录。</p>
      <api-model-picker id="models"></api-model-picker>
      <p id="selection" aria-live="polite">尚未选择演示条目</p>
    </section>
    <section>
      <h2>代码复制</h2>
      <pre id="code">const baseURL = 'https://api.302api.com/v1';</pre>
      <api-code-copy for="code"></api-code-copy>
    </section>
    <section>
      <h2>状态展示</h2>
      <p>组件只显示传入的状态；这里没有实时采集，默认显示未知。</p>
      <api-status-badge state="unknown"></api-status-badge>
    </section>
    <footer>MIT · <a href="../README.md">开发者文档</a> · <a href="https://302api.com/docs">302API 接入文档</a></footer>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
